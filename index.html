<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0d14">
  <title>Mixbox</title>
  <link rel="manifest" href="JSON/manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="Css/style.css">
</head>

<body>

  <div class="app">

    <header class="topbar">
      <div class="brand">
        <div class="brand-text">
          <span class="brand-mark">MIXBOX</span>
          <span class="brand-sub">Your Dream Beat</span>
        </div>
        <div class="brand-tagline">
          <svg class="headphone-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 18v-6a9 9 0 0 1 18 0v6"/>
            <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/>
          </svg>
          <span>Best experience with headphones</span>
        </div>
      </div>

      <nav class="chapters" id="chapters"></nav>

      <div class="master-controls">
        <button id="mixChaptersBtn" class="ghost-btn toggle-btn" title="Mix chapters">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 3h5v5"/>
            <path d="M4 20 21 3"/>
            <path d="M21 16v5h-5"/>
            <path d="m15 15 6 6"/>
            <path d="M4 4l5 5"/>
          </svg>
          <span>Mix Chapters</span>
        </button>

        <button id="stopAllBtn" class="ghost-btn" title="Stop all">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
            <rect x="6" y="6" width="12" height="12" rx="2"/>
          </svg>
          <span>Stop</span>
        </button>

        <button id="saveMixBtn" class="ghost-btn" title="Save Mix">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
            <polyline points="17 21 17 13 7 13 7 21"/>
            <polyline points="7 3 7 8 15 8"/>
          </svg>
          <span>Save</span>
        </button>

        <button id="loadMixBtn" class="ghost-btn" title="Load Mixes">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
          </svg>
          <span>Load</span>
        </button>

        <label class="volume" title="Master Volume">
          <span>Volume</span>
          <input type="range" id="masterVolume" min="0" max="1" step="0.01" value="0.85">
        </label>
      </div>
    </header>

    <main class="stage-wrap" id="stageWrap">
      <div class="stage-lighting" id="stageLighting">
        <span class="beam beam-1"></span>
        <span class="beam beam-2"></span>
        <span class="beam beam-3"></span>
        <span class="beam beam-4"></span>
      </div>

      <div class="chapter-intro" id="chapterIntro">
        <span class="chapter-intro-title" id="chapterIntroTitle"></span>
      </div>

      <div class="cycle-ring" id="cycleRing" title="Current bar progress">
        <svg viewBox="0 0 64 64">
          <circle class="ring-track" cx="32" cy="32" r="28"></circle>
          <circle class="ring-progress" id="ringProgress" cx="32" cy="32" r="28"></circle>
        </svg>
      </div>

      <div class="stage" id="stage"></div>
      
      <!-- Interactive Reactive Floor -->
      <div class="stage-floor" id="stageFloor"></div>
      <p class="stage-hint" id="stageHint">Drag a character from the tray below, or just click it</p>
    </main>

    <section class="tray" id="tray">
      <div class="tray-loading" id="trayLoading">Loading sounds…</div>
    </section>

  </div>

  <!-- Modal Backdrop -->
  <div id="modalBackdrop" class="modal-backdrop"></div>

  <!-- Save Modal -->
  <div id="saveModal" class="modal">
    <div class="modal-header">
      <h3>
        <svg class="title-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
          <polyline points="17 21 17 13 7 13 7 21"/>
          <polyline points="7 3 7 8 15 8"/>
        </svg>
        Save Your Mix
      </h3>
      <button class="modal-close-btn" data-close="saveModal">&times;</button>
    </div>
    <div class="modal-body">
      <div class="modal-field">
        <label for="mixNameInput">Mix Title</label>
        <div class="input-row">
          <input type="text" id="mixNameInput" placeholder="e.g. Midnight Groove" maxlength="32">
          <button id="confirmSaveBtn" class="action-btn primary-btn">Save Mix</button>
        </div>
      </div>

      <div class="modal-divider"><span>OR SHARE AS URL</span></div>

      <div class="modal-field">
        <label>Exportable Link</label>
        <button id="modalShareBtn" class="action-btn share-btn full-width">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
          </svg>
          <span>Copy Shareable URL</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Load Modal -->
  <div id="loadModal" class="modal">
    <div class="modal-header">
      <h3>
        <svg class="title-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
        </svg>
        My Saved Mixes
      </h3>
      <button class="modal-close-btn" data-close="loadModal">&times;</button>
    </div>
    <div class="modal-body">
      <!-- Saved Mixes List Container -->
      <div class="saved-mixes-list" id="savedMixesList"></div>

      <div class="modal-divider"><span>OR IMPORT FROM LINK</span></div>

      <div class="modal-field">
        <label for="pasteUrlInput">Paste Mix URL or Code</label>
        <div class="input-row">
          <input type="text" id="pasteUrlInput" placeholder="Paste link or mix code here...">
          <button id="confirmLoadUrlBtn" class="action-btn primary-btn">Load Link</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="assets/chapters.js"></script>
  <script src="JS/script.js"></script>
</body>

</html>
